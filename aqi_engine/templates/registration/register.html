{% extends "core/base.html" %}
{% block title %}Register Account · AQI Evaluator{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-sm border border-slate-200 p-6 mt-6">
    <h1 class="text-xl font-bold text-slate-900 mb-1">Create Staff Account</h1>
    <p class="text-xs text-slate-500 mb-6">Register as a Scientist or Data Verifier</p>

    <form method="post" class="space-y-4">
        {% csrf_token %}

        <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Username</label>
            <input type="text" name="username" required
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
        </div>

        <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Email</label>
            <input type="email" name="email" required
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
        </div>

        <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Role</label>
            <select name="role" class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm">
                <option value="scientist">Scientist (PySpark Models & Forecasting)</option>
                <option value="verifier">Verifier (Sensor Anomaly Validation)</option>
            </select>
        </div>

        <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Institution / Organization</label>
            <input type="text" name="institution" placeholder="e.g., CPCB / IIT Delhi"
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
        </div>

        <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Password</label>
            <input type="password" name="password" required
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
        </div>

        <button type="submit"
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-md text-sm">
            Create Account
        </button>
    </form>

    <p class="text-xs text-center text-slate-500 mt-5">
        Already have an account?
        <a href="{% url 'login' %}" class="text-emerald-600 font-semibold hover:underline">Sign in</a>
    </p>
</div>
{% endblock %}
